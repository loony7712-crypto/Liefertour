<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Liefertour"><meta name="theme-color" content="#0f6e74">
<title>Liefertour</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#1d2733;--mut:#5b6575;--line:#d6dce3;--acc:#0f6e74;--accbg:#e2f1f1;--ok:#2e7d32;--okbg:#e6f4e7;--rot:#c62828;--rotbg:#fdecea;--gelb:#9a5800;--gelbbg:#fff1dc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:46px}
button.haupt{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button.rot{background:var(--rotbg);color:var(--rot);border-color:#f1b5b0}
input,textarea{font:inherit;font-size:17px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;background:#fff;color:var(--ink)}
header{position:sticky;top:0;z-index:500;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top))}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{min-height:42px;padding:6px 12px}
main{padding:12px;padding-bottom:110px;max-width:760px;margin:0 auto}
.karte-t{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.tour{display:flex;gap:10px;align-items:center}.tour .t{flex:1;min-width:0}.tour b{display:block;font-size:18px}
.klein{font-size:14px;color:var(--mut)}
.hinweis{background:var(--gelbbg);color:var(--gelb);border-radius:12px;padding:10px 12px;margin-bottom:10px}
#karte{height:38vh;min-height:220px;border-radius:14px;border:1px solid var(--line);margin-bottom:8px;background:#e8ecef}
.info{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:4px 2px 8px;font-size:15px;color:var(--mut)}
.reihe{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.reihe button{flex:1}
.liste{display:flex;flex-direction:column;gap:6px}
.stopp{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
.stopp.fertig{opacity:.55}.stopp.naechster{border:2px solid var(--acc)}.stopp.zieht{box-shadow:0 6px 18px rgba(0,0,0,.2);opacity:.95}
.griff{touch-action:none;cursor:grab;font-size:22px;color:var(--mut);padding:8px 4px;user-select:none}
.nr{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.stopp.fertig .nr{background:var(--ok)}.stopp.fehlt .nr{background:var(--rot)}
.st{flex:1;min-width:0}.st b{display:block}.st .a{font-size:15px;overflow-wrap:anywhere}
.haken{width:52px;height:52px;border-radius:50%;font-size:24px;padding:0;flex:none}
.stopp.fertig .haken{background:var(--okbg);color:var(--ok);border-color:#a8d5ab}
.unten{position:fixed;left:0;right:0;bottom:0;z-index:600;background:var(--card);border-top:1px solid var(--line);padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.unten button{width:100%;font-size:19px;min-height:58px;border-radius:14px}
.unten .ziel{font-size:14px;color:var(--mut);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin{background:var(--acc);color:#fff;border:2px solid #fff;border-radius:50%;display:flex!important;align-items:center;justify-content:center;font:700 13px Arial;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.fertig{background:#8a9aa5}.pin.naechster{background:#e65100}.pin.start{background:#1d2733}
.dlg-bg{position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:1000;display:flex;align-items:flex-end;justify-content:center}
.dlg{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.dlg-kopf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:19px}
.dlg-fuss{display:flex;gap:8px;margin-top:12px}.dlg-fuss button{flex:1}
.vorschl{display:flex;flex-direction:column;gap:6px;margin-top:8px}.vorschl button{text-align:left}
.feld{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mut);margin-bottom:10px}
.wahl{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wahl button.an{background:var(--accbg);border:2px solid var(--acc);font-weight:600}
/* Fahrmodus: groß, wenig Text, Knöpfe im Daumenbereich unten */
.fahrt{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#eef2f4}
.fahrt-kopf{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line)}
.fahrt-kopf b{flex:1;text-align:center;font-size:18px}
.fahrt-mitte{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px}
.fahrt-karte{background:var(--card);border-radius:18px;padding:16px;border:2px solid var(--acc)}
.fahrt-karte .gnr{width:54px;height:54px;border-radius:50%;background:#e65100;color:#fff;font:700 26px Arial;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.fahrt-karte .fn{font-size:24px;font-weight:700;line-height:1.2}
.fahrt-karte .fa{font-size:22px;line-height:1.3;margin-top:4px;overflow-wrap:anywhere}
.fahrt-karte .fz{background:var(--gelbbg);color:var(--gelb);border-radius:10px;padding:8px 10px;margin-top:10px;font-size:18px}
.danach{font-size:16px;color:var(--mut);padding:0 4px}
.fahrt-unten{padding:10px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;background:var(--card);border-top:1px solid var(--line)}
.fahrt-unten .klein3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fahrt-unten .klein3 button{min-height:56px;font-size:16px}
.fahrt-unten .nav{min-height:64px;font-size:20px;border:2px solid var(--acc);color:var(--acc);font-weight:600;border-radius:16px}
.fahrt-unten .weiter{min-height:88px;font-size:23px;font-weight:700;background:var(--ok);color:#fff;border-color:var(--ok);border-radius:18px}
.unten .start{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700;min-height:64px;font-size:21px}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#22303d;color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:2000;max-width:90vw;text-align:center}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
"use strict";
/* Liefertour (Spec 001 Stufe 1, 30.10.2026): Touren mit Stopps, Reihenfolge legt der Fahrer fest (Ziehen oder ▲▼),
   Karte (OpenStreetMap/Leaflet), Strecke (OSRM), Navigation zum nächsten Stopp mit Google Maps oder Apple Karten (wählbar).
   Adresssuche über Photon (OpenStreetMap). Alles im Speicher des Handys (localStorage), kein Server, keine Konten. */
(function(){
const LS="liefertour-v1",PHOTON="https://photon.komoot.io/api/",OSRM="https://router.project-osrm.org/route/v1/driving/";
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;
    if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="class")e.className=v;else if(k==="style")e.style.cssText=v;else if(k==="value")e.value=v;else e.setAttribute(k,v===true?"":v)}
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
const neuId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const datum=()=>new Date().toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});
const kmT=k=>k<10?k.toFixed(1).replace(".",","):Math.round(k).toString();
const zeitT=m=>m<60?`${Math.round(m)} Min`:`${Math.floor(m/60)} Std ${Math.round(m%60)} Min`;
let toastT;function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>e.style.display="none",3500)}

let D=null;try{D=JSON.parse(localStorage.getItem(LS))}catch(e){}
D=D||{einst:{start:null,nav:/iPhone|iPad|Macintosh/.test(navigator.userAgent)?"apple":"google"},touren:[],cache:{}};
function speichern(){try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){toast("Speichern hat nicht geklappt. Ist der Speicher voll?")}}
const tour=id=>D.touren.find(t=>t.id===id);

/* ---------- Adresssuche (Photon, OpenStreetMap) ---------- */
function bias(){const s=D.einst.start;return s?`&lat=${s.lat}&lon=${s.lon}`:""}
function label(p){const str=[p.street,p.housenumber].filter(Boolean).join(" "),ort=[p.postcode,p.city||p.town||p.village||p.locality||p.district].filter(Boolean).join(" ");
  const teile=[p.name&&p.name!==p.street?p.name:"",str,ort].filter(Boolean);return[...new Set(teile)].join(", ")}
async function suche(q,limit=5){const r=await fetch(`${PHOTON}?q=${encodeURIComponent(q)}&limit=${limit}&lang=de${bias()}`);if(!r.ok)throw new Error("Suche "+r.status);
  const j=await r.json();return j.features.map(f=>({lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],text:label(f.properties),hn:!!f.properties.housenumber}))}
// Eine Zeile aus einer eingefügten Liste: „Name, Straße 1, PLZ Ort“ oder nur die Adresse
// mitName=false: die Zeile ist sicher nur eine Adresse (z. B. aus Excel-Spalten)
async function finde(zeile,mitName=true){const k=(mitName?"":"a:")+zeile.trim().toLowerCase();if(D.cache[k])return D.cache[k];
  const teile=zeile.split(",").map(s=>s.trim()).filter(Boolean);let name="",q=zeile;
  if(mitName&&teile.length>=3&&!/\d/.test(teile[0])){name=teile[0];q=teile.slice(1).join(", ")}
  let r=(await suche(q,1))[0];
  if(!r&&mitName&&!name&&teile.length>=2&&!/\d/.test(teile[0])){name=teile[0];r=(await suche(teile.slice(1).join(", "),1))[0]}
  if(!r)return null;
  // Angezeigt wird die Adresse so, wie sie in der Liste stand (mit „38 C“ usw.); die Kartensuche liefert nur den Punkt auf der Karte.
  // Nur wenn die Zeile keine Hausnummer hatte, steht der Text der Kartensuche da.
  const eigen=name?zeile.slice(zeile.indexOf(",")+1).trim():zeile.trim();
  const e={lat:r.lat,lon:r.lon,text:/\d/.test(eigen)?eigen:r.text,name};D.cache[k]=e;speichern();return e}

/* ---------- Dialoge (von unten, gut mit dem Daumen) ---------- */
function dialog(titel,inhalt,knoepfe){return new Promise(ok=>{
  const zu=w=>{bg.remove();ok(w)};
  const bg=h("div",{class:"dlg-bg",onclick:e=>{if(e.target===bg)zu(null)}},h("div",{class:"dlg"},h("div",{class:"dlg-kopf"},h("b",{},titel),h("button",{onclick:()=>zu(null),"aria-label":"Schließen"},"✕")),inhalt,
    knoepfe&&knoepfe.length?h("div",{class:"dlg-fuss"},...knoepfe.map(k=>h("button",{class:k.klasse||"",onclick:()=>{if(k.pruefe&&!k.pruefe())return;zu(k.wert)}},k.text))):null));
  document.body.append(bg);const f=bg.querySelector("input,textarea");if(f&&!("ontouchstart" in window))setTimeout(()=>f.focus(),50)})}
function eingabe(titel,wert="",ph=""){const f=h("input",{value:wert,placeholder:ph});
  f.addEventListener("keydown",e=>{if(e.key==="Enter")f.closest(".dlg").querySelector(".dlg-fuss .haupt").click()});
  return dialog(titel,f,[{text:"Abbrechen",wert:null},{text:"OK",klasse:"haupt",wert:"ok"}]).then(w=>w==="ok"?f.value.trim():null)}
const frage=(titel,text,ja="Ja",klasse="haupt")=>dialog(titel,h("p",{},text),[{text:"Nein",wert:false},{text:ja,klasse,wert:true}]).then(w=>!!w);
// Adresse suchen mit Vorschlägen beim Tippen; mehrfach=true: Dialog bleibt für weitere Adressen offen
function adresseSuchen(titel,{mehrfach=false,beiWahl}){
  const f=h("input",{placeholder:"Straße Nr, Ort",autocomplete:"off",enterkeyhint:"search"}),liste=h("div",{class:"vorschl"}),stand=h("div",{class:"klein",style:"margin-top:6px"});
  let timer=null,nr=0;
  const los=async()=>{const q=f.value.trim();if(q.length<3){liste.replaceChildren();stand.textContent="";return}const meins=++nr;stand.textContent="Suche …";
    try{const r=await suche(q,6);if(meins!==nr)return;stand.textContent=r.length?"":"Nichts gefunden. Mit Ort oder Postleitzahl versuchen.";
      liste.replaceChildren(...r.map(x=>h("button",{onclick:()=>{beiWahl(x);if(mehrfach){f.value="";liste.replaceChildren();stand.textContent=`Hinzugefügt: ${x.text}`;f.focus()}else zu.click()}},x.text)))}
    catch(e){if(meins===nr)stand.textContent="Keine Verbindung zur Adresssuche. Ist das Handy online?"}};
  f.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(los,400)});
  f.addEventListener("keydown",e=>{if(e.key==="Enter"){clearTimeout(timer);los()}});
  const zu=h("button",{class:"haupt",style:"width:100%;margin-top:12px",onclick:()=>{const bg=zu.closest(".dlg-bg");if(bg)bg.remove();fertig()}},mehrfach?"Fertig":"Abbrechen");
  let fertig=()=>{};
  return new Promise(ok=>{fertig=ok;dialog(titel,h("div",{},f,stand,liste,zu),[]).then(()=>ok())})}

/* ---------- Seiten ---------- */
let seite={art:"touren"};
// Die zuletzt offene Ansicht wird gemerkt: Lädt das Handy die App nach dem Navigieren neu, geht es im Fahrmodus weiter
function geh(s){seite=s;D.ansicht={art:s.art,id:s.id||null};speichern();if(karte){karte.remove();karte=null}window.scrollTo(0,0);wachHalten(s.art==="fahrt");zeige()}
function zeige(){const a=$("#app");if(seite.art==="fahrt"&&tour(seite.id))a.replaceChildren(fahrtSeite(tour(seite.id)));
  else if(seite.art==="tour"&&tour(seite.id))a.replaceChildren(...tourSeite(tour(seite.id)));else if(seite.art==="einst")a.replaceChildren(...einstSeite());else{seite={art:"touren"};a.replaceChildren(...tourenSeite())}
  if(seite.art==="tour"){const t=tour(seite.id);setTimeout(()=>{aktualisiere(t,true);karteZeichnen(true);gezeigt=punkte(t).length;streckeHolen()},30)}
  if(seite.art==="fahrt")streckeHolen()}

function tourenSeite(){
  const neu=async()=>{const n=await eingabe("Neue Tour",`Tour ${datum()}`);if(n==null)return;const t={id:neuId(),name:n||`Tour ${datum()}`,erstellt:Date.now(),zurueck:true,stopps:[]};D.touren.unshift(t);speichern();geh({art:"tour",id:t.id})};
  return[h("header",{},h("h1",{},"Liefertour"),h("button",{onclick:()=>geh({art:"einst"})},"Einstellungen")),
    h("main",{},
      !D.einst.start?h("div",{class:"hinweis",onclick:()=>geh({art:"einst"})},"Bitte zuerst unter Einstellungen den Startpunkt eintragen (z. B. das Lager)."):null,
      h("button",{class:"haupt",style:"width:100%;font-size:19px;min-height:56px;margin-bottom:8px",onclick:neu},"+ Neue Tour"),
      h("button",{style:"width:100%;margin-bottom:12px",onclick:dateiOeffnen},"Tour aus Datei öffnen"),
      D.touren.length?D.touren.map(t=>{const fertig=t.stopps.filter(s=>s.erledigt).length;
        return h("div",{class:"karte-t tour"},h("div",{class:"t",onclick:()=>geh({art:"tour",id:t.id})},h("b",{},t.name),h("span",{class:"klein"},`${t.stopps.length} Stopps${fertig?` · ${fertig} erledigt`:""}`)),
          h("button",{onclick:()=>tourMenue(t),"aria-label":"Mehr"},"⋯"))}):h("p",{class:"klein",style:"text-align:center;margin-top:30px"},"Noch keine Touren. Tippe auf „+ Neue Tour“."))]}
async function tourMenue(t){
  const w=await dialog(t.name,h("div",{style:"display:flex;flex-direction:column;gap:8px"},
    ...[["umbenennen","Umbenennen"],["kopie","Kopieren (alle Stopps wieder offen)"],["offen","Alle Haken entfernen"],["weg","Tour löschen"]].map(([k,txt])=>h("button",{class:k==="weg"?"rot":"",onclick:e=>{e.target.closest(".dlg-bg").remove();aktion(k)}},txt))),[]);
  async function aktion(k){
    if(k==="umbenennen"){const n=await eingabe("Name der Tour",t.name);if(n){t.name=n;speichern();zeige()}}
    if(k==="kopie"){const n={...JSON.parse(JSON.stringify(t)),id:neuId(),name:t.name+" (Kopie)",erstellt:Date.now()};n.stopps.forEach(s=>{s.erledigt=false;s.id=neuId()});D.touren.unshift(n);speichern();zeige()}
    if(k==="offen"){t.stopps.forEach(s=>s.erledigt=false);speichern();zeige()}
    if(k==="weg"&&await frage("Tour löschen",`„${t.name}“ mit ${t.stopps.length} Stopps löschen?`,"Löschen","rot")){D.touren=D.touren.filter(x=>x!==t);speichern();zeige()}}}

function einstSeite(){
  const s=D.einst.start;
  const navKnopf=(k,t)=>h("button",{class:D.einst.nav===k?"an":"",onclick:()=>{D.einst.nav=k;speichern();zeige()}},t);
  return[h("header",{},h("button",{onclick:()=>geh({art:"touren"})},"← Touren"),h("h1",{},"Einstellungen")),
    h("main",{},
      h("div",{class:"karte-t"},h("b",{},"Startpunkt"),h("p",{class:"klein",style:"margin:4px 0 8px"},s?s.text:"Noch nicht eingetragen. Von hier starten alle Touren."),
        h("button",{class:"haupt",style:"width:100%",onclick:()=>adresseSuchen("Startpunkt",{beiWahl:x=>{D.einst.start={lat:x.lat,lon:x.lon,text:x.text};speichern();zeige()}})},s?"Startpunkt ändern":"Startpunkt eintragen")),
      h("div",{class:"karte-t"},h("b",{},"Navigation mit"),h("p",{class:"klein",style:"margin:4px 0 8px"},"Diese App öffnet beim Knopf „Navigieren“ das gewählte Kartenprogramm."),
        h("div",{class:"wahl"},navKnopf("google","Google Maps"),navKnopf("apple","Apple Karten"))),
      h("div",{class:"karte-t"},h("b",{},"Gemerkte Adressen"),h("p",{class:"klein",style:"margin:4px 0 8px"},`${Object.keys(D.cache).length} Adressen sind gespeichert und werden beim nächsten Einlesen sofort gefunden.`),
        h("button",{onclick:async()=>{if(await frage("Adressen vergessen","Alle gemerkten Adressen vergessen? Touren bleiben erhalten.","Vergessen","rot")){D.cache={};speichern();zeige()}}},"Gemerkte Adressen vergessen")),
      h("div",{class:"karte-t"},h("b",{},"Andere Fahrer"),h("p",{class:"klein",style:"margin:4px 0 8px"},"Schickt den Link zu dieser App per WhatsApp. Der Fahrer öffnet ihn und legt die App auf seinen Startbildschirm."),
        h("button",{style:"width:100%;background:#e7f8ee;border-color:#9fd8b4;color:#11672f;font-weight:600;margin-bottom:8px",onclick:appWeitergeben},"App per WhatsApp weitergeben"),
        h("button",{style:"width:100%",onclick:()=>window.open("anleitung.html","_blank")},"Anleitung für Fahrer")),
      h("p",{class:"klein"},"Alles bleibt auf diesem Handy. Karte und Adresssuche: © OpenStreetMap-Mitwirkende, Photon, OSRM."))]}

/* ---------- Teilen: Tour als Link (WhatsApp) oder Datei ---------- */
// Der Link enthält die ganze Tour, gepackt (deflate) und als Text kodiert. Wer die App noch nicht hat, bekommt sie mit demselben Link.
const b64=u=>{let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
async function packe(obj){const json=JSON.stringify(obj);
  if(window.CompressionStream){const st=new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"));return "z"+b64(new Uint8Array(await new Response(st).arrayBuffer()))}
  return "j"+b64(new TextEncoder().encode(json))}
async function entpacke(s){const buf=unb64(s.slice(1));
  if(s[0]==="z"){const st=new Blob([buf]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return JSON.parse(await new Response(st).text())}

const tourDaten=t=>({v:1,n:t.name,z:t.zurueck!==false,st:D.einst.start,s:t.stopps.map(s=>[s.text,s.lat==null?null:+s.lat.toFixed(6),s.lon==null?null:+s.lon.toFixed(6),s.name||"",s.tel||"",s.notiz||""])});

  z.forEach((s,i)=>{if(benutzt.has(i))return;
    const m=s.match(/^(?:(.*?),\s*)?([A-Za-zÄÖÜäöüß][^,]*?[A-Za-zäöüß.]\s\d{1,4}\s?[a-zA-Z]?)[,\s]+(\d{5}\s+[A-Za-zÄÖÜäöüß][^,]*)$/);

  inp.addEventListener("change",async()=>{const f=inp.files[0];if(!f)return;const neu=await fotoLesen(f);if(neu==null){if(liste.length)pruefen(t,liste);return}

window.__fotoLesen=f=>fotoLesen(f); // zum Prüfen
async function fotoLesen(datei,titel="Foto wird gelesen"){
  const st=h("div",{style:"font-size:20px;text-align:center;padding:20px 0"},"Texterkennung wird vorbereitet …");
  const bg=h("div",{class:"dlg-bg"},h("div",{class:"dlg"},h("div",{class:"dlg-kopf"},h("b",{},titel)),st,h("p",{class:"klein",style:"text-align:center"},"Beim ersten Mal wird die Texterkennung geladen (einige MB), danach geht es schneller.")));
  document.body.append(bg);
  try{ocrFort=m=>{st.textContent=m.status==="recognizing text"?`Text wird gelesen … ${Math.round((m.progress||0)*100)} %`:"Texterkennung wird vorbereitet …"};
    const w=await ocrLaden(),b=await bildVorbereiten(datei);
    await w.setParameters({tessedit_pageseg_mode:"4"});const a=adressenAusText((await w.recognize(b.sw)).data.text);
    await w.setParameters({tessedit_pageseg_mode:"3"});const c=adressenAusText((await w.recognize(b.grau)).data.text);
    // zusammenführen: Reihenfolge der Schwarz-weiß-Fassung, fehlende aus der grauen ergänzen; vollständigere Lesung gewinnt
    const key=e=>e.q.toLowerCase().replace(/[^a-zäöüß0-9]/g,"").replace(/stra(ss|ß)e$/,"str").slice(0,10);
    for(const e of c){const da=a.find(x=>key(x)===key(e)||x.q.split(",")[0].slice(0,6).toLowerCase()===e.q.split(",")[0].slice(0,6).toLowerCase());
      if(!da)a.push(e);else{if(e.q.length>da.q.length&&/\d/.test(e.q.split(",")[0]))da.q=e.q;if(!da.name||(e.name&&/^[A-ZÄÖÜa-zäöüß -]+$/.test(e.name)&&e.name.length>=da.name.length))da.name=e.name||da.name;if(!da.notiz)da.notiz=e.notiz}}
    return a}
  catch(e){console.warn(e);toast("Die Texterkennung lädt nicht. Ist das Handy online?");return null}
  finally{ocrFort=null;bg.remove()}}
/* ---------- PDF einlesen (Wunsch 31.10.2026): Tourenliste als PDF ----------
   PDF mit Text: Text direkt auslesen (pdf.js, Zeilen nach Höhe zusammengesetzt), schnell und ohne Lesefehler.
   Eingescannte PDF (nur Bild): Seite als Bild darstellen und wie ein Foto mit der Texterkennung lesen. Danach dieselbe Prüfliste. */
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
async function pdfLaden(){if(window.pdfjsLib)return;
  await new Promise((ok,nein)=>{const s=document.createElement("script");s.src=PDFJS+"pdf.min.js";s.onload=ok;s.onerror=()=>nein(new Error("laden"));document.head.append(s)});
  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js"}
async function pdfZeilen(seite){const tc=await seite.getTextContent(),zeilen=[];
  for(const it of tc.items){if(!it.str||!it.str.trim())continue;const y=it.transform[5],x=it.transform[4];
    let z=zeilen.find(l=>Math.abs(l.y-y)<Math.max(2,(it.height||10)*0.4));if(!z){z={y,teile:[]};zeilen.push(z)}z.teile.push({x,s:it.str,w:it.width||0})}
  // Leerzeichen nur bei echter Lücke: manche PDFs teilen „Ehm-Welk-Str.“ in Stücke
  return zeilen.sort((a,b)=>b.y-a.y).map(z=>{let s="",ende=null;for(const t of z.teile.sort((a,b)=>a.x-b.x)){s+=(ende!=null&&t.x-ende>1.5?" ":"")+t.s;ende=t.x+t.w}return s.replace(/\s+/g," ").trim()})}
async function pdfLesen(datei){
  const st=h("div",{style:"font-size:20px;text-align:center;padding:20px 0"},"PDF wird geöffnet …"),bg=h("div",{class:"dlg-bg"},h("div",{class:"dlg"},h("div",{class:"dlg-kopf"},h("b",{},"PDF wird gelesen")),st));
  document.body.append(bg);const liste=[],bilder=[];
  try{await pdfLaden();const pdf=await pdfjsLib.getDocument({data:await datei.arrayBuffer()}).promise;
    for(let n=1;n<=pdf.numPages;n++){st.textContent=`Seite ${n} von ${pdf.numPages} …`;const s=await pdf.getPage(n),z=await pdfZeilen(s);
      if(z.join("").length<20)bilder.push(s);else liste.push(...adressenAusText(z.join("\n")))}}
  catch(e){console.warn(e);bg.remove();toast("Die PDF ließ sich nicht lesen. Ist das Handy online?");return null}
  bg.remove();
  for(const s of bilder){const vp=s.getViewport({scale:2.5}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
    const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);await s.render({canvasContext:g,viewport:vp}).promise;
    const neu=await fotoLesen(c,`Eingescannte Seite wird gelesen`);if(neu)liste.push(...neu)}
  return liste}
window.__pdfLesen=pdfLesen; // zum Prüfen

// Prüfliste: jede erkannte Adresse lässt sich korrigieren oder entfernen, dann „Einlesen“ oder ein weiteres Foto

  const zeichneP=()=>box.replaceChildren(...(liste.length?liste.map((e,i)=>{

      return h("div",{class:"karte-t",style:"padding:8px 10px;margin-bottom:6px"},h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"},
          h("b",{},`${i+1}.${e.notiz?" · "+e.notiz:""}`),h("button",{class:"rot",style:"min-height:38px;padding:4px 12px",onclick:()=>{liste.splice(i,1);zeichneP()}},"✕ Entfernen")),n,a)}):
    [h("p",{},"Auf dem Foto wurde keine Adresse erkannt. Bitte das Papier gerade, hell und scharf fotografieren.")]));
  zeichneP();

/* ---------- Fahrmodus (Wunsch 31.10.2026): während der Fahrt nur große Knöpfe.
   Ein Tipp auf „Erledigt – weiter“ hakt den Stopp ab und startet sofort die Navigation zum nächsten. ---------- */
let wachSperre=null,letzterErledigt=null;
async function wachHalten(an){ // Bildschirm im Fahrmodus nicht ausgehen lassen (wo der Browser es kann)
  try{if(an&&"wakeLock" in navigator&&!wachSperre){wachSperre=await navigator.wakeLock.request("screen");wachSperre.addEventListener("release",()=>{wachSperre=null})}
    else if(!an&&wachSperre){await wachSperre.release();wachSperre=null}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&seite.art==="fahrt"){wachHalten(true);zeige()}});
function fahrtSeite(t){
  const n=naechster(t),idx=n?t.stopps.indexOf(n)+1:0,fertig=t.stopps.filter(s=>s.erledigt).length;
  const nachN=n?t.stopps.slice(idx).find(s=>!s.erledigt):null,nachIdx=nachN?t.stopps.indexOf(nachN)+1:0;
  const zurStart=t.zurueck!==false&&D.einst.start;
  const kopf=h("div",{class:"fahrt-kopf"},h("button",{onclick:()=>geh({art:"tour",id:t.id})},"← Liste"),h("b",{},n?`Stopp ${idx} von ${t.stopps.length}`:t.name),h("span",{class:"klein"},`${fertig} ✓`));
  if(!n)return h("div",{class:"fahrt"},kopf,h("div",{class:"fahrt-mitte"},h("div",{class:"fahrt-karte",style:"border-color:var(--ok);text-align:center"},h("div",{class:"fn"},"Alle Stopps erledigt"),h("div",{class:"klein",style:"margin-top:6px"},`${t.stopps.length} Stopps in „${t.name}“`))),
    h("div",{class:"fahrt-unten"},letzterErledigt?h("button",{onclick:rueckgaengig},"↶ Letzten Haken zurücknehmen"):null,

  const zu=strecke&&strecke.key===streckeKey&&strecke.zu[n.id];

    h("div",{class:"fahrt-mitte"},
      h("div",{class:"fahrt-karte",onclick:()=>stoppDialog(t,n)},h("div",{class:"gnr"},idx),n.name?h("div",{class:"fn"},n.name):null,h("div",{class:"fa"},n.text),
        n.lat==null?h("div",{class:"fz",style:"background:var(--rotbg);color:var(--rot)"},"Adresse nicht gefunden: hier tippen und korrigieren"):null,
        n.notiz?h("div",{class:"fz"},n.notiz):null,zu?h("div",{class:"klein",style:"margin-top:8px"},`ca. ${kmT(zu.km)} km · ${zeitT(zu.min)} ab dem letzten Stopp`):null),
      nachN?h("div",{class:"danach"},`Danach: ${nachIdx} · ${nachN.name?nachN.name+", ":""}${nachN.text}`):h("div",{class:"danach"},zurStart?"Danach: zurück zum Start":"Das ist der letzte Stopp.")),
    h("div",{class:"fahrt-unten"},
      h("div",{class:"klein3"},h("button",{onclick:()=>{if(n.tel)location.href="tel:"+n.tel.replace(/[^\d+]/g,"");else toast("Keine Telefonnummer bei diesem Stopp.")},style:n.tel?"":"opacity:.45"},"Anrufen"),
        h("button",{onclick:spaeter},"Später"),h("button",{onclick:rueckgaengig,style:letzterErledigt?"":"opacity:.45"},"↶ Zurück")),
      h("button",{class:"nav",onclick:()=>navigiere(n)},`Navigieren zu ${idx}`),

/* ---------- Karte und Strecke ---------- */
function punkte(t){const p=[];if(D.einst.start)p.push({...D.einst.start,id:"start"});for(const s of t.stopps)if(s.lat!=null)p.push(s);if(t.zurueck!==false&&D.einst.start&&t.stopps.length)p.push({...D.einst.start,id:"ende"});return p}
function karteZeichnen(einpassen){const t=tour(seite.id),el=$("#karte");if(!t||!el||typeof L==="undefined")return;
  if(!karte){karte=L.map(el,{zoomControl:true});let fehler=0;
    const osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"});
    osm.on("tileerror",()=>{if(++fehler===4){karte.removeLayer(osm);L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap, © CARTO"}).addTo(karte)}});
    osm.addTo(karte);schicht=L.layerGroup().addTo(karte);karte.setView(D.einst.start?[D.einst.start.lat,D.einst.start.lon]:[51.16,10.45],D.einst.start?12:6);einpassen=true}

// Strecke in der festgelegten Reihenfolge (OSRM, in Stücken von höchstens 80 Punkten, damit es keine Obergrenze gibt)
function streckeHolen(){clearTimeout(streckeT);streckeT=setTimeout(async()=>{const t=tour(seite.id);if(!t)return;const p=punkte(t);
  const key=p.map(x=>x.lat.toFixed(5)+","+x.lon.toFixed(5)).join(";");streckeKey=key;

  try{let geo=[],km=0,min=0;const zu={};
    for(let i=0;i<p.length-1;i+=79){const teil=p.slice(i,i+80);if(teil.length<2)break;
      const r=await fetch(OSRM+teil.map(x=>`${x.lon.toFixed(6)},${x.lat.toFixed(6)}`).join(";")+"?overview=full&geometries=geojson");const j=await r.json();
      if(j.code!=="Ok")throw new Error(j.code);const rt=j.routes[0];geo.push(...rt.geometry.coordinates.map(c=>[c[1],c[0]]));km+=rt.distance/1000;min+=rt.duration/60;
      rt.legs.forEach((lg,k)=>{const ziel=teil[k+1];if(ziel.id&&ziel.id!=="ende")zu[ziel.id]={km:lg.distance/1000,min:lg.duration/60}})}
    if(streckeKey!==key)return;strecke={key,geo,km,min,zu};
    if(seite.art==="tour"&&seite.id===t.id){karteZeichnen(false);infoZeichnen(t);listeZeichnen(t)}
    if(seite.art==="fahrt"&&seite.id===t.id)zeige()}
  catch(e){console.warn(e);const i=$("#info");if(i&&streckeKey===key)i.lastChild&&(i.lastChild.textContent="Strecke gerade nicht verfügbar (Internet?)")}},700)}
